services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: "${TZ:-Europe/Budapest}"
      DATABASE_PATH: /data/coffee-house.sqlite
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - "${DATA_DIR:-./.data}:/data"
    init: true
