<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placeholder Site - Űrlap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark custom-nav">
        <div class="container">
            <a class="navbar-brand" href="../index.html">PLACEHOLDER LOGO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#foMenu" aria-controls="foMenu" aria-expanded="false" aria-label="Menü megnyitása">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="foMenu">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="../index.html">Főoldal</a>
                    <a class="nav-link" href="lista.html">Listák</a>
                    <a class="nav-link" href="tablazat.html">Táblázat</a>
                    <a class="nav-link active" href="urlap.html">Űrlap</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="p-4 bg-white rounded shadow-sm">
            <h1>Placeholder Űrlap</h1>
            <p>Kérlek töltsd ki az alábbi mezőket. Hibás kitöltés esetén a JavaScript/jQuery validáció piros kerettel és hibaüzenettel jelzi a problémát.</p>
            <form id="kapcsolat-urlap" novalidate>
                <!-- Egysoros szöveg -->
                <div class="mb-3">
                    <label for="nev" class="form-label">Név (egysoros mező):</label>
                    <input type="text" id="nev" class="form-control" placeholder="Lorem Ipsum">
                    <div class="hiba-uzenet" id="hiba-nev"></div>
                </div>

                <!-- Többsoros szöveg -->
                <div class="mb-3">
                    <label for="uzenet" class="form-label">Üzenet (többsoros mező):</label>
                    <textarea id="uzenet" rows="3" class="form-control" placeholder="Írj ide placeholder szöveget..."></textarea>
                    <div class="hiba-uzenet" id="hiba-uzenet"></div>
                </div>

                <!-- Dátumválasztó -->
                <div class="mb-3">
                    <label for="datum" class="form-label">Dátum:</label>
                    <input type="date" id="datum" class="form-control">
                    <div class="hiba-uzenet" id="hiba-datum"></div>
                </div>

                <!-- Színválasztó -->
                <div class="mb-3">
                    <label for="szin" class="form-label">Kedvenc szín:</label>
                    <input type="color" id="szin" class="form-control form-control-color" value="#0d6efd">
                </div>

                <!-- Radio gombok -->
                <div class="mb-3" id="radio-csoport">
                    <label class="form-label d-block">Opció választása (Radio):</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="opcio" id="opcio1" value="A">
                        <label class="form-check-label" for="opcio1">Opció A</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="opcio" id="opcio2" value="B">
                        <label class="form-check-label" for="opcio2">Opció B</label>
                    </div>
                    <div class="hiba-uzenet" id="hiba-radio"></div>
                </div>

                <!-- Checkbox -->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="elfogad">
                    <label class="form-check-label" for="elfogad">Elfogadom a placeholder feltételeket</label>
                    <div class="hiba-uzenet" id="hiba-elfogad"></div>
                </div>

                <!-- Gombok -->
                <button type="submit" class="btn egyedi-gomb me-2">Küldés</button>
                <button type="reset" class="btn btn-secondary">Alaphelyzet</button>
            </form>
        </div>
    </main>

    <footer class="text-center py-3 text-muted">
        <small>&copy; 2026 Placeholder Site &ndash; Minden jog fenntartva.</small>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
