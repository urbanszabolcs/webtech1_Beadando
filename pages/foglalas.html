<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee House – Asztalfoglalás</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Animált navigációs menü -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-nav sticky-top">
        <div class="container">
            <a class="navbar-brand brand-anim" href="../index.html">COFFEE HOUSE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#foMenu" aria-controls="foMenu" aria-expanded="false" aria-label="Menü megnyitása">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="foMenu">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="../index.html">Főoldal</a>
                    <a class="nav-link" href="kinalat.html">Kínálat</a>
                    <a class="nav-link" href="etlap.html">Étlap</a>
                    <a class="nav-link" href="galeria.html">Galéria</a>
                    <a class="nav-link active" href="foglalas.html">Asztalfoglalás</a>
                    <a class="nav-link" href="velemeny.html">Vélemény</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="p-4 p-md-5 bg-white rounded-4 shadow-sm">
            <h1>Asztalfoglalás</h1>
            <p>
                Foglalj előre asztalt a Coffee House-ba! Ha a tapasztalataidat szeretnéd megosztani velünk,
                látogass el a külön <a href="velemeny.html" class="egyedi-link">Vélemény &amp; Értékelés</a> oldalra.
            </p>

            <form id="foglalas-urlap" class="mt-4" novalidate>
                <!-- Egysoros szövegmező -->
                <div class="mb-3">
                    <label for="nev" class="form-label">Vendég neve:</label>
                    <input type="text" id="nev" class="form-control" placeholder="Pl. Kovács Anna">
                    <div class="hiba-uzenet" id="hiba-nev"></div>
                </div>

                <!-- Dátumválasztó -->
                <div class="mb-3">
                    <label for="datum" class="form-label">Foglalás dátuma:</label>
                    <input type="date" id="datum" class="form-control">
                    <div class="hiba-uzenet" id="hiba-datum"></div>
                </div>

                <!-- Radio gombok: Asztal típusa -->
                <div class="mb-3" id="asztal-csoport">
                    <label class="form-label d-block">Preferált elhelyezkedés:</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="asztalTipus" id="asztal1" value="Ablak melletti">
                        <label class="form-check-label" for="asztal1">Ablak melletti</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="asztalTipus" id="asztal2" value="Csendes sarok">
                        <label class="form-check-label" for="asztal2">Csendes sarok</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="asztalTipus" id="asztal3" value="Terasz">
                        <label class="form-check-label" for="asztal3">Terasz</label>
                    </div>
                    <div class="hiba-uzenet" id="hiba-asztal"></div>
                </div>

                <!-- Színválasztó -->
                <div class="mb-3">
                    <label for="dekor-szin" class="form-label">Ünnepi asztaldekoráció / szalvéta színe (opcionális):</label>
                    <input type="color" id="dekor-szin" class="form-control form-control-color" value="#6d4c41">
                </div>

                <!-- Többsoros szövegmező -->
                <div class="mb-3">
                    <label for="megjegyzes" class="form-label">Létszám és különleges kérés (allergia, babaülés stb.):</label>
                    <textarea id="megjegyzes" rows="3" class="form-control" placeholder="Pl. 3 fő részére, 18:00-tól szeretnénk asztalt..."></textarea>
                    <div class="hiba-uzenet" id="hiba-megjegyzes"></div>
                </div>

                <!-- Checkbox -->
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="elfogad">
                    <label class="form-check-label" for="elfogad">Elfogadom a foglalási és adatkezelési feltételeket</label>
                    <div class="hiba-uzenet" id="hiba-elfogad"></div>
                </div>

                <!-- Gombok -->
                <button type="submit" class="btn egyedi-gomb me-2">Asztal lefoglalása</button>
                <button type="reset" class="btn btn-secondary">Alaphelyzet</button>
            </form>

            <div id="sikeres-foglalas" class="mt-4"></div>
        </div>
    </main>

    <footer class="text-center py-4 text-muted">
        <small>&copy; 2026 Coffee House &ndash; Webtechnológiák beadandó projekt.</small>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
